plugins {
    id 'net.neoforged.moddev' version '2.0.141'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        clientData {
            clientData()
            programArguments.addAll '--mod', 'akw',
                '--all',
                '--output', file('src/main/generated').getAbsolutePath(),
                '--existing', file('src/main/resources').getAbsolutePath()
        }
        serverData {
            serverData()
            programArguments.addAll '--mod', 'akw',
                '--all',
                '--output', file('src/main/generated').getAbsolutePath(),
                '--existing', file('src/main/resources').getAbsolutePath()
        }
    }

    mods {
        akw {
            sourceSet(sourceSets.main)
        }
    }

    // Unit-Tests für weltunabhängige Logik (reactor/*) bekommen dasselbe
    // Minecraft-/NeoForge-Classpath wie der main-Sourceset, damit auch Klassen
    // wie ValidationError (BlockPos/Component) oder ItemPortMode
    // (StringRepresentable) im Test ladbar sind.
    unitTest {
        enable()
        testedMod = mods.akw
    }
}

sourceSets.main.resources.srcDir 'src/main/generated'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// NeoForge-Artefakte strikt von den (alten) Fabric-Jars trennen:
// alle hier gebauten Jars landen unter build/libs/neoforge/.
jar {
    destinationDirectory = layout.buildDirectory.dir('libs/neoforge')
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.named('sourcesJar') {
    destinationDirectory = layout.buildDirectory.dir('libs/neoforge')
}
